# Earth Rover  --  always-on service manifest
# ===========================================
# Single source of truth for what runs on the rover and how it is supervised.
# Consumed by:
#   * scripts/startup/install_user_units.sh  -> generates systemd --user units
#   * vehicle_control_station mission view   -> renders the live tier chart
#
# Supervision model
#   systemd --user (lingering) is the only supervisor: one process per unit,
#   grouped into targets. Targets with `boot: true` are enabled at boot.
#   Sensor units wait for their hardware (wait_for_hw.sh) instead of sleeping
#   for a fixed delay, restart forever, and simply sit in "activating" when a
#   sensor is not on the rig.
#
# Service fields
#   target:  key under `targets:`, `graphical` (desktop session), or `none`
#            (on demand: start it by hand or from the VCS)
#   stage:   run one stage of launch/earth_rover_system.launch.py with every
#            other stage off and no delay, so the field-tuned launch defaults
#            stay in one place; `args:` adds launch arguments
#   exec:    command to run instead of a stage (after ROS is sourced)
#   wait_for: hardware specs for wait_for_hw.sh (usb:VID:PID, path:/dev/x, udp:PORT)
#   external: hand-written unit in this directory; listed here only so the
#            VCS shows it, never generated
#
# Site-specific values (bind addresses, overrides) go in
# ~/.config/earth-rover/secrets.env (mode 600, not in git).

mission:
  name: Earth Rover
  description: >
    Always-on rover stack. The DeepGIS link (MAVROS, telemetry, pose) and every
    sensor driver start at boot and restart on their own; recording, rqt and
    the kiosk are started on demand.
  target: er-sensors.target

targets:
  sensors:
    unit: er-sensors.target
    description: Earth Rover sensor drivers (always on)
    boot: true
  console:
    unit: er-console.target
    description: Earth Rover web console (rosbridge, web video, VCS)
    boot: false

tiers:
  1: Vehicle Link
  2: Sensor Drivers
  3: Web Bridge
  4: Application
  5: On Demand

# ----- environment defaults inherited by every generated unit -----------------
defaults:
  ros_distro: jazzy
  ros2_ws: /home/jdas/ros2_ws
  earth_rover_home: /home/jdas/earth-rover
  ros_domain_id: "0"

# ----- service catalog --------------------------------------------------------
services:

  # =========== Tier 1  --  vehicle link (hand-written, er-deepgis.target) =====
  - id: deepgis-mavros
    name: MAVROS / Pixhawk
    tier: 1
    external: true
    description: The only MAVROS on the rover (vehicle_interface.launch.py over the FTDI cable).
    health_topic: /mavros/state

  - id: deepgis-telemetry
    name: DeepGIS Telemetry
    tier: 1
    external: true
    description: MAVROS odometry + GPS to the DeepGIS portal, spooled on weak links.

  - id: deepgis-pose
    name: DeepGIS Pose
    tier: 1
    external: true
    description: Live rover position on the DeepGIS globe.

  # =========== Tier 2  --  sensor drivers (er-sensors.target) =================
  - id: grasshopper
    name: Grasshopper3 Stereo
    tier: 2
    target: sensors
    stage: grasshopper
    wait_for: [usb:1e10:3300]
    description: Left + right Grasshopper3 cameras (Spinnaker).
    health_topic: /stereo/left/image_raw

  - id: velodyne
    name: Velodyne VLP-16
    tier: 2
    target: sensors
    stage: velodyne
    wait_for: [udp:2368]
    description: Velodyne driver, pointcloud and laserscan chain; waits for packets on 2368.
    health_topic: /velodyne_points

  - id: laser
    name: Laser Ranger
    tier: 2
    target: sensors
    stage: laser
    wait_for: [path:/dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DO01SSV5-if00-port0]
    description: USB-serial laser rangefinder; also republishes the raw serial_data.
    health_topic: /laser_distance

  - id: spectrometer
    name: Ocean Optics Spectrometer
    tier: 2
    target: sensors
    stage: spectrometer
    wait_for: [usb:2457:101e]
    description: Flame-S spectrum publisher and intensity plot image.

  - id: radio
    name: Radio Stack (ADS-B)
    tier: 2
    target: sensors
    stage: radio_vio
    wait_for: [usb:0bda:2838]
    description: RTL-SDR dump1090 ADS-B decoder, aircraft state vectors and plots.
    health_topic: /adsb/rtl_adsb_decoder_node/aircraft_list

  # =========== Tier 3/4  --  web console (er-console.target) ==================
  - id: rosbridge
    name: ROSBridge WebSocket :9090
    tier: 3
    target: console
    exec: 'exec ros2 launch rosbridge_server rosbridge_websocket_launch.xml address:=${VCS_BIND_ADDRESS:-127.0.0.1}'
    description: WebSocket to ROS 2 bridge for the VCS browser client.

  - id: web-video
    name: Web Video Server :8080
    tier: 3
    target: console
    exec: 'exec ros2 run web_video_server web_video_server --ros-args -p address:=${VCS_BIND_ADDRESS:-127.0.0.1} -p port:=8080'
    description: HTTP MJPEG server for camera image topics.

  - id: vcs
    name: Vehicle Control Station (Django)
    tier: 4
    target: console
    after: [rosbridge, web-video]
    exec: 'cd ${EARTH_ROVER_HOME}/vehicle_control_station && exec python3 manage.py runserver ${VCS_BIND_ADDRESS:-127.0.0.1}:${VCS_PORT}'
    env:
      VCS_PORT: "8000"
    description: Django rover dashboard and mission chart.
    health_url: http://localhost:8000/

  # =========== Tier 5  --  on demand ==========================================
  - id: record
    name: Bag Recorder
    tier: 5
    target: none
    exec: 'exec ros2 launch deepgis_vehicles record_bag.launch.py'
    description: rosbag2 (mcap) recording to ~/earth-rover-bags.

  - id: rqt
    name: rqt Perspective
    tier: 5
    target: graphical
    stage: rqt
    description: rqt on the rover display with the earth_rover perspective.

  - id: kiosk
    name: Firefox Kiosk
    tier: 5
    target: graphical
    after: [vcs]
    exec: 'exec ${EARTH_ROVER_HOME}/scripts/startup/firefox_kiosk.sh http://localhost:8000/mission/'
    description: Fullscreen Firefox on the VCS mission page.

  - id: realsense
    name: RealSense Camera
    tier: 5
    target: none
    exec: 'exec ros2 launch realsense2_camera rs_launch.py'
    description: Intel RealSense (driver not installed for Jazzy yet).

  - id: metavision
    name: Metavision Event Camera
    tier: 5
    target: none
    exec: 'exec ros2 launch metavision_driver driver_node.launch.py'
    description: Prophesee event camera driver.
